name: Auto Assign
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
jobs:
  run:
    # Fork PR tokens are read-only; do not escalate to pull_request_target.
    if: github.event_name == 'issues' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Assign issue or pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ASSIGNEE: dahsamtransport-source
        run: |
          set -euo pipefail
          [[ "$NUMBER" =~ ^[0-9]+$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/assignees" -f "assignees[]=$ASSIGNEE" --jq '.assignees[].login'
