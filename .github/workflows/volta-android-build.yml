name: Build VOLTA Android APK

on:
  workflow_dispatch:
  push:
    branches: [ volta-android-build ]
    paths:
      - 'volta-android/**'
      - '.github/workflows/volta-android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: volta-android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK exists
        run: test -s volta-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOLTA-debug-apk
          path: volta-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
